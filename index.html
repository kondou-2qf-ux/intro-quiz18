<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>イントロクイズ - スマホQR早押し対応版</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #131a2a;
    --panel-light: #1c253b;
    --border: #2a3652;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #f59e0b;
    --accent-hover: #d97706;
    --green: #10b981;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  button { cursor: pointer; border: none; outline: none; transition: all 0.14s ease; font-weight: 800; }
  button:active { transform: scale(0.97); }
  input, select { background: #0d1322; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
  input:focus, select:focus { border-color: var(--accent); outline: none; }

  /* ================= HOST HEADER ================= */
  .header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 40;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
  }
  .brand h1 { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; }
  .room-status-row { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
  .room-id-pill { font-size: 12px; color: var(--accent); font-weight: 800; }
  .conn-dot-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
    color: #34d399; background: rgba(16, 185, 129, 0.14); padding: 2px 9px; border-radius: 99px;
  }
  .conn-dot-badge.warn { color: #fbbf24; background: rgba(245, 158, 11, 0.16); }

  .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn-nav {
    padding: 9px 14px; border-radius: 10px; font-size: 13px;
    background: var(--panel-light); color: var(--text); border: 1px solid var(--border);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-nav:hover { background: #263350; }
  .btn-qr {
    background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
  }
  .btn-qr:hover { filter: brightness(1.1); }
  .btn-nav.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .badge-count { background: rgba(0,0,0,0.35); color: #fff; padding: 2px 8px; border-radius: 99px; font-size: 11px; }

  /* ================= HOST LAYOUT ================= */
  .main-grid {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px;
    padding: 16px 20px; max-width: 1480px; margin: 0 auto;
  }
  @media (max-width: 960px) { .main-grid { grid-template-columns: 1fr; padding
